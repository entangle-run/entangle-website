<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Entangle graph runtime diagram</title>
  <desc id="desc">A graph of user, host, runner, relay, and artifact nodes connected by typed edges.</desc>
  <rect width="960" height="640" rx="36" fill="#0f172a"/>
  <path d="M190 320 370 185 595 220 770 350 560 470 330 430Z" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
  <path d="M370 185 560 470M595 220 330 430M190 320 595 220M770 350 370 185" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="12 14" opacity=".55"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <g transform="translate(190 320)">
      <circle r="62" fill="#f8fafc"/>
      <circle r="62" fill="none" stroke="#38bdf8" stroke-width="5"/>
      <text y="8" fill="#0f172a">User</text>
    </g>
    <g transform="translate(370 185)">
      <circle r="70" fill="#e0f2fe"/>
      <circle r="70" fill="none" stroke="#38bdf8" stroke-width="5"/>
      <text y="-4" fill="#0f172a">Host</text>
      <text y="24" fill="#475569" font-size="16" font-weight="600">control plane</text>
    </g>
    <g transform="translate(595 220)">
      <circle r="66" fill="#f1f5f9"/>
      <circle r="66" fill="none" stroke="#38bdf8" stroke-width="5"/>
      <text y="-4" fill="#0f172a">Runner</text>
      <text y="24" fill="#475569" font-size="16" font-weight="600">per node</text>
    </g>
    <g transform="translate(770 350)">
      <circle r="68" fill="#e2e8f0"/>
      <circle r="68" fill="none" stroke="#38bdf8" stroke-width="5"/>
      <text y="-4" fill="#0f172a">Relay</text>
      <text y="24" fill="#475569" font-size="16" font-weight="600">Nostr</text>
    </g>
    <g transform="translate(560 470)">
      <circle r="72" fill="#dbeafe"/>
      <circle r="72" fill="none" stroke="#38bdf8" stroke-width="5"/>
      <text y="-4" fill="#0f172a">Artifact</text>
      <text y="24" fill="#475569" font-size="16" font-weight="600">git-backed</text>
    </g>
    <g transform="translate(330 430)">
      <circle r="64" fill="#f8fafc"/>
      <circle r="64" fill="none" stroke="#38bdf8" stroke-width="5"/>
      <text y="-4" fill="#0f172a">Studio</text>
      <text y="24" fill="#475569" font-size="16" font-weight="600">operator</text>
    </g>
  </g>
</svg>
