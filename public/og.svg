<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Entangle - Federated runtime for coding-agent organizations</title>
  <desc id="desc">Brand visual showing the Entangle topology: User Node, Host, Runner, Relay, and Artifact nodes connected by signed event and git artifact boundaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#080a12"/>
    </linearGradient>
    <marker id="arrow-ctrl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2dd4bf" opacity="0.95"/>
    </marker>
    <marker id="arrow-msg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#22d3ee" opacity="0.95"/>
    </marker>
    <marker id="arrow-art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b" opacity="0.95"/>
    </marker>
    <marker id="arrow-view" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8" opacity="0.95"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g aria-hidden="true" stroke="rgba(148,163,184,0.05)" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
  </g>
  <text x="80" y="118" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="68" font-weight="820">Entangle</text>
  <text x="80" y="178" fill="#5eead4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="720">Federated runtime for coding-agent organizations</text>
  <text x="80" y="222" fill="#94a3b8" font-family="JetBrains Mono, ui-monospace, monospace" font-size="20" font-weight="600">signed nodes · explicit topology · git artifacts</text>
  <text x="80" y="585" fill="#94a3b8" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" font-weight="600">entangle.run</text>
  <text x="1120" y="585" text-anchor="end" fill="#94a3b8" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" font-weight="600">github.com/entangle-run/entangle</text>

  <!-- Topology graph (right side, 600..1200 horizontal) -->
  <g transform="translate(660 250)">
    <!-- Edges, trimmed at node radius + small offset -->
    <g fill="none" stroke-width="2.5" stroke-linecap="round">
      <!-- User(80,200) -> Host(220,40) r_user=42, r_host=52 -->
      <path d="M101.7 163.5 L196.0 65.8" stroke="#2dd4bf" marker-end="url(#arrow-ctrl)"/>
      <!-- Host(220,40) -> Runner(400,120) r_host=42, r_runner=50 -->
      <path d="M258.4 56.8 L356.4 100.4" stroke="#2dd4bf" marker-end="url(#arrow-ctrl)"/>
      <!-- Runner(400,120) -> Relay(490,260) r_runner=40, r_relay=46 -->
      <path d="M421.4 153.3 L466.0 222.5" stroke="#22d3ee" marker-end="url(#arrow-msg)"/>
      <!-- Runner(400,120) -> Artifact(240,300) r_runner=38, r_art=44 -->
      <path d="M380.4 142.6 L262.4 275.0" stroke="#f59e0b" marker-end="url(#arrow-art)"/>
      <!-- Artifact(240,300) -> User(80,200) r_art=42, r_user=46 -->
      <path d="M204.6 277.7 L116.4 222.4" stroke="#94a3b8" marker-end="url(#arrow-view)"/>
    </g>

    <!-- Nodes -->
    <g>
      <g transform="translate(80 200)">
        <circle r="46" fill="rgba(255,255,255,0.04)"/>
        <circle r="40" fill="#0b1020" stroke="#2dd4bf" stroke-width="2.5"/>
        <text y="-3" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="800" fill="#f1f5f9">User</text>
        <text y="16" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="600" fill="#5eead4">operator</text>
      </g>
      <g transform="translate(220 40)">
        <circle r="52" fill="rgba(255,255,255,0.04)"/>
        <circle r="46" fill="#0b1020" stroke="#22d3ee" stroke-width="2.5"/>
        <text y="-3" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="800" fill="#f1f5f9">Host</text>
        <text y="16" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="600" fill="#67e8f9">control plane</text>
      </g>
      <g transform="translate(400 120)">
        <circle r="50" fill="rgba(255,255,255,0.04)"/>
        <circle r="44" fill="#0b1020" stroke="#a3e635" stroke-width="2.5"/>
        <text y="-3" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="800" fill="#f1f5f9">Runner</text>
        <text y="16" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="600" fill="#bef264">per node</text>
      </g>
      <g transform="translate(490 260)">
        <circle r="46" fill="rgba(255,255,255,0.04)"/>
        <circle r="40" fill="#0b1020" stroke="#94a3b8" stroke-width="2.5"/>
        <text y="-3" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="800" fill="#f1f5f9">Relay</text>
        <text y="16" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="600" fill="#cbd5e1">signed Nostr</text>
      </g>
      <g transform="translate(240 300)">
        <circle r="48" fill="rgba(255,255,255,0.04)"/>
        <circle r="42" fill="#0b1020" stroke="#f59e0b" stroke-width="2.5"/>
        <text y="-3" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="800" fill="#f1f5f9">Artifact</text>
        <text y="16" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="600" fill="#fcd34d">git handoff</text>
      </g>
    </g>
  </g>
</svg>
